# prek.toml — git pre-commit hooks. Docs: https://prek.j178.dev/

# === Built-ins ==============================================================

[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "mixed-line-ending", args = ["--fix=lf"] },
  { id = "fix-byte-order-marker" },
  { id = "check-merge-conflict" },
  { id = "check-added-large-files", args = ["--maxkb=500"] },
  { id = "check-case-conflict" },
  { id = "check-symlinks" },
  { id = "check-executables-have-shebangs" },
  { id = "check-shebang-scripts-are-executable" },
  { id = "detect-private-key" },
  { id = "check-yaml" },
  { id = "check-toml" },
  { id = "check-json" },
]

# === Deno ===================================================================

[[repos]]
repo = "local"

[[repos.hooks]]
id = "deno-fmt"
name = "deno fmt"
entry = "deno fmt"
language = "system"
files = '\.(ts|tsx|js|jsx|mjs|cjs|json|jsonc)$'
exclude = '^(deno\.lock|assets/)'

[[repos.hooks]]
id = "deno-lint"
name = "deno lint"
entry = "deno lint"
language = "system"
types = ["ts"]

# === Markdown ===============================================================

[[repos]]
repo = "https://github.com/DavidAnson/markdownlint-cli2"
rev = "v0.22.1"
hooks = [{ id = "markdownlint-cli2" }]

# === GitHub Actions =========================================================

[[repos]]
repo = "https://github.com/rhysd/actionlint"
rev = "v1.7.12"
hooks = [{ id = "actionlint" }]
